<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Detail - Hanlin Zhao</title>
  <link rel="stylesheet" href="style-aboutme.css" />
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="theme.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body><a class="skip-link" href="#main">Skip to content</a>

  <!-- Reuse header -->
  <header class="site-header">
  <a class="wordmark" href="index.html" aria-label="Hanlin Zhao home"><img src="personal-mark.svg" alt=""><span class="wordmark-caption">HANLIN ZHAO<br>PERSONAL SPACE</span></a>
  <nav id="primary-nav" aria-label="Primary"><ul>
    <li><a href="index.html">Hello</a></li><li><a href="about.html" class="active" aria-current="page">Profile</a></li><li><a href="program.html">Projects</a></li><li><a href="life-hobbies.html">Life &amp; hobbies</a></li>
  </ul></nav>
  <a class="header-contact" href="mailto:hanlinzhaojj@gmail.com">Let's talk <span aria-hidden="true">↗</span></a>
  <button class="menu-toggle" aria-label="Open navigation" aria-controls="primary-nav" aria-expanded="false"><span></span><span></span><span></span></button>
</header>

  <main id="main">
    <section class="about-container" style="padding-top: 26px;">
      <div class="card m-hover" style="max-width: 980px; margin: 18px auto;">
        <div class="card-body">

          <a class="back-link" href="about.html#journey">‹ Back to My Journey</a>

          <div id="detail" class="journey-detail">
            <h1 class="jd-title">Loading…</h1>
            <p class="jd-muted">If you see this for long, check that journey-data.js is in the same folder.</p>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer>
    <p id="footer-year">© Hanlin Zhao. All rights reserved.</p>
  </footer>

  <script src="journey-data.js"></script>
  <script>
    document.getElementById('footer-year').textContent = `© ${new Date().getFullYear()} Hanlin Zhao. All rights reserved.`;
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const data = (window.JOURNEY_DATA || {})[id];
    const el = document.getElementById("detail");

    if (!data) {
      el.innerHTML = `
        <h1 class="jd-title">Not found</h1>
        <p class="jd-muted">This journey entry does not exist.</p>
      `;
    } else {
      el.innerHTML = `
        <h1 class="jd-title">${data.title}</h1>
        <div class="jd-meta"><strong>${data.org}</strong> · ${data.date}</div>

        <div class="jd-tags">
          ${data.tags.map(t => `<span class="kw">${t}</span>`).join("")}
        </div>

        <div class="jd-content">
          ${data.paragraphs.map(p => `<p>${p}</p>`).join("")}
        </div>

        ${data.bullets && data.bullets.length ? `
          <div class="jd-box">
            <div class="jd-box-title">Highlights</div>
            <ul>
              ${data.bullets.map(b => `<li>${b}</li>`).join("")}
            </ul>
          </div>` : ""
        }
      `;
    }
  </script>
<script src="hamburger.js" defer></script>
</body>
</html>
